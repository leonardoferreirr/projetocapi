<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área da aluna | Projeto C.A.P.I.</title>
<meta name="description" content="Área da aluna do Projeto C.A.P.I.: módulos diários, tarefas, progresso, encontros em grupo e check-in de bem-estar.">
<meta name="theme-color" content="#F6F4F1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{document.documentElement.dataset.tema=localStorage.getItem('capi.tema')||'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
<link rel="preload" href="/assets/fonts/poppins-light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jakarta-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'ArchivoCAPI';src:url('/assets/fonts/archivo-var.woff2') format('woff2');font-weight:600 900;font-display:optional}
@font-face{font-family:'ArchivoFB';src:local('Arial Bold'),local('Arial-BoldMT');font-weight:600 900;size-adjust:86%}
@font-face{font-family:'PoppinsCAPI';src:url('/assets/fonts/poppins-light.woff2') format('woff2');font-weight:300;font-display:optional}
@font-face{font-family:'PoppinsCAPI';src:url('/assets/fonts/poppins-medium.woff2') format('woff2');font-weight:500;font-display:optional}
@font-face{font-family:'PoppinsFB';src:local('Arial'),local('Helvetica Neue');size-adjust:113%}
@font-face{font-family:'Jakarta';src:url('/assets/fonts/jakarta-var.woff2') format('woff2');font-weight:200 800;font-display:optional}
@font-face{font-family:'JakartaFB';src:local('Arial'),local('Helvetica Neue'),local('Liberation Sans');size-adjust:105%}
:root,[data-tema=claro]{
  --coral:#CC4452;--coral-600:#B53A47;--coral-t:#B53A47;--bordo:#723147;--creme:#F8E5AD;--apoio:#723147;
  --bg:#F6F4F1;--s1:#FFFFFF;--s2:#F2EEE9;--s3:#E8E2DB;--s4:#DDD5CD;
  --txt:#1A1517;--mut:#5F5357;--fra:#766A6E;--line:rgba(26,21,23,.09);--line2:rgba(26,21,23,.16);
  --ok:#723147;--okbg:rgba(114,49,71,.1);--okink:#fff;--logo:#723147;
  --barbg:rgba(255,255,255,.92);--barbg2:rgba(255,255,255,.78);--tabbg:rgba(255,255,255,.97);--avisobg:#FBF4DE;--sombra:0 18px 40px -24px rgba(26,21,23,.28);
  color-scheme:light;
  --display:'ArchivoCAPI','ArchivoFB','Arial Narrow',Arial,sans-serif;--sans:'Jakarta','JakartaFB',Arial,sans-serif;--titulo:'PoppinsCAPI','PoppinsFB',Arial,sans-serif;--r:18px;--bh:64px;
}
[data-tema=escuro]{
  --apoio:#F8E5AD;
  --bg:#0F0D0E;--s1:#181516;--s2:#211D1F;--s3:#2C2729;--s4:#383234;
  --txt:#F3EEE9;--mut:rgba(243,238,233,.68);--fra:rgba(243,238,233,.56);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ok:#F8E5AD;--okbg:rgba(248,229,173,.12);--okink:#3B1724;--logo:#F8E5AD;
  --barbg:rgba(15,13,14,.92);--barbg2:rgba(15,13,14,.76);--tabbg:rgba(15,13,14,.97);--avisobg:rgba(248,229,173,.07);--sombra:0 18px 40px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.55 var(--sans);color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font:300 clamp(1.9rem,4vw + .8rem,3rem)/1.1 var(--titulo);letter-spacing:-.025em}
h2{font:500 1.3rem/1.2 var(--titulo);letter-spacing:-.015em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--mut)}.fra{color:var(--fra)}
.pq{font-size:.88rem}

/* shell */
.bar{position:sticky;top:0;z-index:30;height:var(--bh);display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--barbg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(6px)){.bar{background:var(--barbg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.bar .logo{width:92px;color:var(--logo);flex:none;display:block}
.bar .logo svg{display:block;width:100%;height:auto}
.bar nav{display:none}
.bar .dir{display:flex;align-items:center;gap:10px;margin-left:auto}
.pill-prog{display:none;align-items:center;gap:10px;font-size:.85rem;color:var(--mut)}
.pill-prog i{display:block;width:90px;height:6px;border-radius:9px;background:var(--s3);overflow:hidden}
.pill-prog i b{display:block;height:100%;background:var(--coral);border-radius:9px}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-weight:700;cursor:pointer;display:grid;place-items:center}
.tema-b{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--s1);color:var(--txt);cursor:pointer;display:grid;place-items:center}
.tema-b svg{width:18px;height:18px}
.menu-av{position:absolute;right:12px;top:calc(var(--bh) - 4px);width:250px;background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:8px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6);display:none}
.menu-av.on{display:block}
.menu-av .quem{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-av .quem b{display:block}
.menu-av a,.menu-av button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;background:none;border:0;cursor:pointer;text-align:left;font-size:.95rem}
.menu-av a:hover,.menu-av button:hover{background:var(--s3)}
.menu-av svg{width:18px;height:18px;opacity:.8}
.vista{padding:0 16px calc(96px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tabbg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;font-size:.7rem;color:var(--fra);border-radius:12px}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--txt);font-weight:700}
.tabs a.on svg{color:var(--coral)}
@media (min-width:980px){
  .bar{padding:0 28px;gap:28px}
  .bar .logo{width:104px}
  .bar nav{display:flex;gap:4px;margin-inline:auto}
  .bar nav a{padding:9px 14px;border-radius:999px;text-decoration:none;font-size:.93rem;color:var(--mut)}
  .bar nav a:hover{color:var(--txt);background:var(--s1)}
  .bar nav a.on{color:var(--txt);background:var(--s2)}
  .bar .dir{margin-left:0}
  .pill-prog{display:flex}
  .tabs{display:none}
  .vista{padding:0 28px 80px}
}

/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--coral);color:#fff;border:0;font-weight:600;text-decoration:none;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--coral-600)}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--s3);color:var(--txt)}
.btn.sec:hover{background:var(--s4)}
.btn.vidro{background:var(--s1);border:1px solid var(--line2);color:var(--txt)}
.btn.vidro:hover{background:var(--s2)}
.btn.pq2{min-height:40px;padding:8px 16px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;gap:10px;width:fit-content}
@media (min-width:560px){.btns{display:flex;flex-wrap:wrap}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sombra)}
.bloco{margin-top:34px}
.bloco > h2{margin-bottom:14px}
.cab-sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.cab-sec a{font-size:.9rem;color:var(--mut)}
.barra{height:6px;border-radius:9px;background:var(--s3);overflow:hidden}
.barra i{display:block;height:100%;background:var(--coral);border-radius:9px;transition:width .6s}
.barra.creme i{background:var(--creme)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--txt);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.93rem;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:980px){.toast{bottom:32px}}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--avisobg);border:1px dashed var(--line2);font-size:.9rem;color:var(--mut)}
.aviso svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--apoio)}
.aviso b{color:var(--txt)}
.etq{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--s3);color:var(--mut)}
.etq svg{width:14px;height:14px;flex:none}
.etq.ok{background:var(--okbg);color:var(--ok)}
.etq.coral{background:rgba(204,68,82,.14);color:var(--coral-t)}
[data-tema=escuro] .etq.coral{background:var(--coral-600);color:#fff}

/* entrar */
.entrar{min-height:100svh;display:grid}
.entrar-foto{position:relative;height:46vh;min-height:300px;overflow:hidden}
.entrar-foto img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.entrar-foto::after{content:"";position:absolute;inset:0 0 -2px;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,var(--bg) 96%)}
.entrar-foto .logo{position:absolute;left:20px;top:20px;width:110px;color:var(--creme);z-index:2}
.entrar-box{position:relative;padding:0 20px 40px;margin-top:-70px;max-width:460px;width:100%;justify-self:center}
.entrar-box h1{font-size:2rem}
.entrar-box p.mut{margin-top:10px}
.campo{display:block;margin-top:16px}
.campo span{display:block;font-size:.88rem;font-weight:600;margin-bottom:7px}
.inp,textarea.inp,select.inp{width:100%;min-height:50px;padding:13px 15px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);color:var(--txt);font:inherit;font-size:16px}
.inp::placeholder{color:var(--fra)}
.inp:focus{outline:2px solid var(--coral);outline-offset:0;border-color:transparent}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.entrar-box .btn{width:100%;margin-top:22px}
.entrar-box .ou{display:flex;align-items:center;gap:12px;margin:18px 0 0;color:var(--mut);font-size:.85rem}
.entrar-box .ou::before,.entrar-box .ou::after{content:"";flex:1;height:1px;background:var(--line)}
.entrar-box .btn.sec{margin-top:14px}
.entrar-box .rod{margin-top:26px;font-size:.84rem;color:var(--mut);text-align:center}
.entrar-box .rod a{color:var(--mut)}
@media (min-width:980px){
  .entrar{grid-template-columns:1.15fr 1fr}
  .entrar-foto{height:auto;min-height:100svh}
  .entrar-foto::after{background:linear-gradient(90deg,transparent 55%,var(--bg))}
  .entrar-box{align-self:center;margin-top:0;padding:40px}
}

/* início */
.banner{position:relative;margin:0 -16px;overflow:hidden;background:var(--s1)}
.banner-foto{position:relative;height:min(84vw,420px)}
.banner-foto img{width:100%;height:100%;object-fit:cover;object-position:30% 40%}
.banner-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,color-mix(in srgb,var(--bg) 70%,transparent) 72%,var(--bg))}
.banner-txt{position:relative;margin-top:-120px;padding:0 16px 8px}
.banner-txt p{margin-top:10px;color:var(--mut);max-width:34rem}
.banner-txt .btns{margin-top:20px}
.banner-txt .prog{margin-top:22px;max-width:420px}
.banner-txt .prog span{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:8px}
@media (min-width:980px){
  .banner{margin:24px 0 0;border-radius:26px;min-height:400px;display:flex;align-items:center}
  .banner-foto{position:absolute;inset:0 0 0 auto;width:62%;height:100%}
  .banner-foto::after{background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--s1) 55%,transparent) 32%,transparent 70%)}
  .banner-txt{margin:0;padding:48px;max-width:640px}
}
.dias{margin-top:26px;position:relative;padding:22px 20px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);box-shadow:var(--sombra);border-top:3px solid var(--coral)}
.dias h2{padding-right:40px}
.dias ol{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:14px}
.dias li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:.95rem;color:var(--mut)}
.dias li b{color:var(--txt);font-weight:600;display:block}
.dias li span.n{width:34px;height:34px;border-radius:11px;background:var(--bordo);color:var(--creme);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.dias .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--s3);cursor:pointer;display:grid;place-items:center}
.dias .x svg{width:16px;height:16px}
@media (min-width:860px){.dias ol{grid-template-columns:repeat(4,1fr)}}
.grade2{display:grid;gap:16px}
@media (min-width:860px){.grade2{grid-template-columns:1fr 1fr}}
.vitrine{display:grid;grid-auto-flow:column;grid-auto-columns:min(44%,220px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.vitrine::-webkit-scrollbar{display:none}
.poster{scroll-snap-align:start;position:relative;display:block;color:#fff;box-shadow:var(--sombra);border-radius:16px;overflow:hidden;aspect-ratio:2/3;text-decoration:none;background:var(--s2);transition:transform .25s}
.poster:hover{transform:translateY(-4px)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,11,0) 35%,rgba(13,10,11,.9))}
.poster .l{position:absolute;left:14px;top:10px;z-index:2;font:800 3.4rem/1 var(--display);line-height:1;color:var(--creme);letter-spacing:-.04em;text-shadow:0 4px 20px rgba(0,0,0,.25)}
.poster .pinfo{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.poster .pinfo b{display:block;font:800 1.15rem/1.1 var(--display);text-transform:uppercase}
.poster .pinfo small{display:block;margin:2px 0 10px;color:rgba(255,255,255,.75);font-size:.8rem}
@media (min-width:980px){.vitrine{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible;margin:0;padding:0}}
.continuar{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;text-decoration:none}
.continuar .th{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--s2)}
.continuar .th img{width:100%;height:100%;object-fit:cover}
.continuar .th svg{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.continuar small{display:block;color:var(--mut);font-size:.82rem}
.continuar b{display:block;margin-top:2px;line-height:1.3}
@media (min-width:560px){.continuar{grid-template-columns:200px 1fr}}

/* check-in */
.ck h2{font-size:1.15rem}
.ck .esc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.ck .esc button{min-height:64px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.ck .esc button b{font:800 1.4rem/1 var(--display)}
.ck .esc button small{font-size:.66rem;color:var(--mut);line-height:1.15;text-align:center}
.ck .esc button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.ck .esc button.on small{color:rgba(255,255,255,.85)}
.ck .sent{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ck .sent button{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:.9rem}
.ck .sent button.on{background:var(--creme);color:#3B1724;border-color:var(--creme)}
.ck .rot{margin-top:18px;font-size:.9rem;font-weight:600}
.ck-feito{display:flex;gap:14px;align-items:center}
.ck-feito .nv{width:56px;height:56px;border-radius:16px;background:var(--bordo);display:grid;place-items:center;font:800 1.6rem/1 var(--display);color:var(--creme);flex:none}
.apoio-alerta{margin-top:14px;padding:16px;border-radius:14px;background:rgba(204,68,82,.14);border:1px solid rgba(204,68,82,.4);font-size:.93rem}
.apoio-alerta b{display:block;margin-bottom:4px}
.apoio-alerta a{font-weight:700;color:var(--txt)}
.graf{width:100%;height:auto;display:block;margin-top:10px}
.graf text{font:500 11px var(--sans);fill:var(--fra)}

/* aula */
.aula{display:grid;gap:22px;padding-top:0}
.aula>*{min-width:0}
.player{position:relative;margin:0 -16px;aspect-ratio:16/9;background:#160810;overflow:hidden}
.player img{width:100%;height:100%;object-fit:cover}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,8,16,.1),rgba(22,8,16,.6));pointer-events:none}
.player .play{position:absolute;left:50%;top:50%;z-index:2;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:0;background:var(--coral);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(204,68,82,.25);transition:transform .2s}
.player .play:hover{transform:scale(1.06)}
.player .play svg{width:30px;height:30px;margin-left:4px}
.player .leg{position:absolute;left:16px;bottom:14px;z-index:2;font-size:.85rem;color:rgba(255,255,255,.88);font-weight:600}
.player video,.player iframe{position:absolute;inset:0;z-index:3;width:100%;height:100%;border:0;background:#000}
.player.tocando .play,.player.tocando .leg,.player.tocando > img{display:none}
.player.tocando::after{display:none}
.player .sem{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(22,8,16,.86)}
.player .sem p{max-width:26rem;color:rgba(255,255,255,.78)}
.player .sem b{display:block;color:#fff;font-size:1.1rem;margin-bottom:6px}
.aula-cab small{display:block;color:var(--mut);font-size:.86rem}
.aula-cab h1{margin-top:6px;font-size:clamp(1.55rem,3vw + .6rem,2.3rem)}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.acoes .nav2{display:flex;gap:8px;margin-left:auto}
.acoes .ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--s1);cursor:pointer;display:grid;place-items:center;text-decoration:none}
.acoes .ib svg{width:20px;height:20px}
.acoes .ib[aria-disabled=true]{opacity:.35;pointer-events:none}
.abas{display:flex;gap:4px;margin-top:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.abas button{flex:none;padding:12px 12px;border:0;background:none;cursor:pointer;color:var(--mut);font-weight:600;font-size:.94rem;border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button.on{color:var(--txt);border-color:var(--coral)}
.abas .cu{display:none}
@media (max-width:560px){.abas{gap:0}.abas button{flex:1;padding:12px 4px;font-size:.9rem}.abas .lg{display:none}.abas .cu{display:inline}}
.painel-aba{padding-top:20px}
.painel-aba .txt{color:var(--mut);max-width:44rem}
.painel-aba .txt p+p{margin-top:12px}
.painel-aba .txt b{color:var(--txt)}
.tarefa .q{margin-top:22px}
.tarefa .q:first-child{margin-top:0}
.tarefa label{display:block;font-weight:600;margin-bottom:4px}
.tarefa .dica{display:block;font-size:.86rem;color:var(--fra);margin-bottom:8px}
.salvo{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:.85rem;line-height:1.2;color:var(--fra);white-space:nowrap}
.salvo svg{width:14px;height:14px;flex:none}
.salvo.on{color:var(--ok)}
.mat{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-decoration:none}
.mat .mi{width:44px;height:44px;border-radius:12px;background:var(--bordo);display:grid;place-items:center;flex:none;color:var(--creme)}
.mat .mi svg{width:20px;height:20px}
.mat span{flex:1;min-width:0}
.mat > svg{width:18px;height:18px;flex:none;color:var(--fra)}
.mat small{display:block;color:var(--mut);font-size:.83rem}
.ferr{margin-top:22px;padding:18px;border-radius:16px;background:var(--s2);border:1px solid var(--line2)}
.ferr h3{margin-bottom:4px}
.ferr .gr{display:grid;gap:12px;margin-top:14px}
@media (min-width:640px){.ferr .gr.c2{grid-template-columns:1fr 1fr}.ferr .gr.c3{grid-template-columns:repeat(3,1fr)}}
.ferr .res{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--bg);font-size:.95rem}
.ferr .res b{color:var(--txt);font:800 1.4rem/1.2 var(--display)}
.lado h2{font-size:1.05rem;margin-bottom:12px}
.pil{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--s1)}
.pil + .pil{margin-top:10px}
.pil summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
.pil summary::-webkit-details-marker{display:none}
.pil summary .lt{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--bordo);color:var(--creme)}
.pil summary span{flex:1;min-width:0}
.pil summary small{display:block;color:var(--mut);font-size:.8rem}
.pil summary .chev{width:18px;height:18px;transition:transform .25s;opacity:.7}
.pil[open] summary .chev{transform:rotate(180deg)}
.pil ul{list-style:none;margin:0;padding:0 6px 8px}
.mod{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:12px;text-decoration:none}
.mod:hover{background:var(--s2)}
.mod.atual{background:var(--s3)}
.mod .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;border:1.5px solid var(--line2);color:var(--mut)}
.mod .st svg{width:14px;height:14px}
.mod.feito .st{background:var(--ok);border-color:var(--ok);color:var(--okink)}
.mod.atual .st{background:var(--coral);border-color:var(--coral);color:#fff}
.mod.bloq{opacity:.6}
.mod .t{font-size:.9rem;line-height:1.3}
.mod .t small{display:block;font-size:.76rem;color:var(--fra);margin-top:2px}
.mod .d{font-size:.75rem;color:var(--fra);white-space:nowrap}
.bloqueado{margin-top:14px;padding:20px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line2);text-align:center}
.bloqueado .cad{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:var(--s3);display:grid;place-items:center}
.bloqueado .cad svg{width:24px;height:24px}
.bloqueado .cont{font-size:1.8rem;font-weight:300;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.bloqueado .btns{margin:18px auto 0}
@media (min-width:980px){
  .aula{grid-template-columns:minmax(0,1fr) 360px;gap:30px;padding-top:24px;align-items:start}
  .player{margin:0;border-radius:22px}
  .lado{position:sticky;top:calc(var(--bh) + 20px);max-height:calc(100vh - var(--bh) - 40px);overflow:auto;padding-right:4px;scrollbar-width:thin}
}

/* conteúdo */
.pil-cab{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.pil-cab img{border-radius:12px;aspect-ratio:2/3;object-fit:cover;width:96px}
.pil-cab p{margin-top:6px;color:var(--mut);font-size:.93rem}
.pil-cab .barra{margin-top:12px;max-width:280px}
.lista-mods{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:4px}
@media (min-width:860px){.lista-mods{grid-template-columns:1fr 1fr;column-gap:16px}}

/* encontros */
.cred{display:flex;align-items:flex-end;gap:12px}
.cred b{font:800 3.6rem/.9 var(--display);letter-spacing:-.04em;color:var(--txt)}
.cred-blocos{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:16px}
.cred-blocos i{height:12px;border-radius:3px;background:var(--coral)}
.cred-blocos i.u{background:var(--s3)}
.slot{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.slot + .slot{margin-top:8px}
.slot .dt{width:56px;height:60px;border-radius:14px;background:var(--s3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.slot .dt small{font-size:.7rem;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
.slot .dt b{font:800 1.5rem/1 var(--display);margin-top:3px}
.slot.meu{border-color:rgba(204,68,82,.55);background:rgba(204,68,82,.08)}
.slot .inf b{display:block;text-transform:capitalize}
.slot .inf small{display:block;color:var(--mut);font-size:.84rem}
.slot .vagas{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.8rem;color:var(--fra)}
.slot .vagas .barra{flex:1;max-width:140px;height:5px}
.slot .ac{grid-column:1/-1;display:flex;justify-content:flex-end}
@media (min-width:640px){.slot{grid-template-columns:56px 1fr auto}.slot .ac{grid-column:auto}}

/* plano */
.plano-sec{padding:20px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.plano-sec + .plano-sec{margin-top:12px}
.plano-sec h3{display:flex;justify-content:space-between;gap:10px;align-items:center}
.plano-sec dl{margin:12px 0 0}
.plano-sec dt{font-size:.82rem;color:var(--fra);margin-top:12px}
.plano-sec dd{margin:4px 0 0;white-space:pre-wrap;color:var(--txt)}
.plano-sec dd.vaz{color:var(--fra);font-style:italic}
.anel{position:relative;width:92px;height:92px;flex:none}
.anel svg{width:92px;height:92px;transform:rotate(-90deg)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.3rem/1 var(--display)}
.sos a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--s2);text-decoration:none;margin-top:8px}
.sos a b.n{font:800 1.5rem/1 var(--display);color:var(--coral);width:54px;flex:none}
@media print{
  body{background:#fff;color:#2a1019}
  .bar,.tabs,.nao-imprime,.toast{display:none!important}
  .plano-sec{background:#fff;border-color:#ddd;break-inside:avoid}
  .plano-sec dd{color:#2a1019}
  .vista{padding:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
